description: >-
  U.S. Bancorp is the parent company of U.S. Bank National Association, one of the largest commercial banks in the
  United States. U.S. Bank provides a developer portal at developer.usbank.com offering APIs for corporate banking,
  payments, and treasury management including RTP, ACH, Positive Pay, corporate account information, data toolbox, fleet
  management (Voyager), freight payment, and push-to-card capabilities. Authentication uses OAuth MFA with SinglePoint
  credentials.
