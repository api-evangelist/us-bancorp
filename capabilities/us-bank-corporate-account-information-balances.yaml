naftiko: 1.0.0-alpha2
info:
  label: US Bank Corporate Account Information API — Balances
  description: 'US Bank Corporate Account Information API — Balances. 2 operations. Lead operation: Get Current Day Account
    Balances. Self-contained Naftiko capability covering one Us Bancorp business surface.'
  tags:
  - Us Bancorp
  - Balances
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    US_BANCORP_API_KEY: US_BANCORP_API_KEY
capability:
  consumes:
  - type: http
    namespace: us-bank-corporate-account-information-balances
    baseUri: https://api.usbank.com/v1
    description: US Bank Corporate Account Information API — Balances business capability. Self-contained, no shared references.
    resources:
    - name: accounts-current-day-balances
      path: /accounts/current-day-balances
      operations:
      - name: getcurrentdaybalances
        method: POST
        description: Get Current Day Account Balances
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Correlation-ID
          in: header
          type: string
          description: Unique identifier for request/response correlation
          required: true
        - name: Accept
          in: header
          type: string
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: accounts-previous-day-balances
      path: /accounts/previous-day-balances
      operations:
      - name: getpreviousdaybalances
        method: POST
        description: Get Previous Day Account Balances
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Correlation-ID
          in: header
          type: string
          required: true
        - name: Accept
          in: header
          type: string
          required: true
        - name: Content-Type
          in: header
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.US_BANCORP_API_KEY}}'
  exposes:
  - type: rest
    namespace: us-bank-corporate-account-information-balances-rest
    port: 8080
    description: REST adapter for US Bank Corporate Account Information API — Balances. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/accounts/current-day-balances
      name: accounts-current-day-balances
      description: REST surface for accounts-current-day-balances.
      operations:
      - method: POST
        name: getcurrentdaybalances
        description: Get Current Day Account Balances
        call: us-bank-corporate-account-information-balances.getcurrentdaybalances
        with:
          Correlation-ID: rest.Correlation-ID
          Accept: rest.Accept
          Content-Type: rest.Content-Type
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts/previous-day-balances
      name: accounts-previous-day-balances
      description: REST surface for accounts-previous-day-balances.
      operations:
      - method: POST
        name: getpreviousdaybalances
        description: Get Previous Day Account Balances
        call: us-bank-corporate-account-information-balances.getpreviousdaybalances
        with:
          Correlation-ID: rest.Correlation-ID
          Accept: rest.Accept
          Content-Type: rest.Content-Type
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: us-bank-corporate-account-information-balances-mcp
    port: 9090
    transport: http
    description: MCP adapter for US Bank Corporate Account Information API — Balances. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-current-day-account-balances
      description: Get Current Day Account Balances
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: us-bank-corporate-account-information-balances.getcurrentdaybalances
      with:
        Correlation-ID: tools.Correlation-ID
        Accept: tools.Accept
        Content-Type: tools.Content-Type
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-previous-day-account-balances
      description: Get Previous Day Account Balances
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: us-bank-corporate-account-information-balances.getpreviousdaybalances
      with:
        Correlation-ID: tools.Correlation-ID
        Accept: tools.Accept
        Content-Type: tools.Content-Type
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
