naftiko: "1.0.0-alpha1"

info:
  label: "US Bank Corporate Account Information"
  description: "US Bank Corporate Account Information API for accessing deposit account balances and transaction data."
  tags:
    - Banking
    - Corporate Banking
    - Account Information
    - Treasury Management
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      USB_CLIENT_ID: USB_CLIENT_ID
      USB_CLIENT_SECRET: USB_CLIENT_SECRET
      USB_OAUTH_TOKEN: USB_OAUTH_TOKEN

capability:
  consumes:
    - type: http
      namespace: usb-accounts
      baseUri: https://api.usbank.com/v1
      description: "US Bank Corporate Account Information API"
      authentication:
        type: bearer
        token: "{{USB_OAUTH_TOKEN}}"
      resources:
        - name: accounts
          path: /accounts
          description: "List authorized deposit accounts"
          operations:
            - name: list-accounts
              method: GET
              description: "Get a list of deposit accounts for the authorized customer"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: current-day-balances
          path: /accounts/current-day-balances
          description: "Get current day balances for multiple accounts"
          operations:
            - name: get-current-day-balances
              method: POST
              description: "Get account balances for up to 50 accounts for the current business day"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  accountNumbers: "{{tools.accountNumbers}}"

        - name: previous-day-balances
          path: /accounts/previous-day-balances
          description: "Get previous day balances for multiple accounts"
          operations:
            - name: get-previous-day-balances
              method: POST
              description: "Get account balances for up to 50 accounts for the previous business day"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  accountNumbers: "{{tools.accountNumbers}}"

        - name: current-day-transactions
          path: /accounts/{accountNumber}/current-day-transactions
          description: "Get current day transactions for an account"
          operations:
            - name: get-current-day-transactions
              method: GET
              description: "Get transactions for a specific account for the current business day"
              inputParameters:
                - name: accountNumber
                  in: path
                  type: string
                  required: true
                  description: "Account number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: transactions
          path: /accounts/{accountNumber}/transactions
          description: "Get transaction history for an account"
          operations:
            - name: get-account-transactions
              method: GET
              description: "Get transactions for a date range (up to 60 days)"
              inputParameters:
                - name: accountNumber
                  in: path
                  type: string
                  required: true
                  description: "Account number"
                - name: fromDate
                  in: query
                  type: string
                  required: true
                  description: "Start date (ISO 8601)"
                - name: toDate
                  in: query
                  type: string
                  required: true
                  description: "End date (ISO 8601)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: usb-accounts-rest
      resources:
        - path: /v1/accounts
          name: accounts
          operations:
            - method: GET
              name: list-accounts
              description: "List corporate deposit accounts"
              call: "usb-accounts.list-accounts"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: usb-accounts-mcp
      transport: http
      tools:
        - name: list-bank-accounts
          description: "List U.S. Bank corporate deposit accounts for the authorized customer"
          hints:
            readOnly: true
            openWorld: false
          call: "usb-accounts.list-accounts"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-current-day-balances
          description: "Get current day balances for up to 50 U.S. Bank deposit accounts"
          hints:
            readOnly: true
            openWorld: false
          call: "usb-accounts.get-current-day-balances"
          with:
            accountNumbers: "tools.accountNumbers"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-previous-day-balances
          description: "Get previous day balances for up to 50 U.S. Bank deposit accounts"
          hints:
            readOnly: true
            openWorld: false
          call: "usb-accounts.get-previous-day-balances"
          with:
            accountNumbers: "tools.accountNumbers"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-current-day-transactions
          description: "Get current business day transactions for a U.S. Bank account"
          hints:
            readOnly: true
            openWorld: false
          call: "usb-accounts.get-current-day-transactions"
          with:
            accountNumber: "tools.accountNumber"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-account-transactions
          description: "Get U.S. Bank account transaction history for a date range"
          hints:
            readOnly: true
            openWorld: false
          call: "usb-accounts.get-account-transactions"
          with:
            accountNumber: "tools.accountNumber"
            fromDate: "tools.fromDate"
            toDate: "tools.toDate"
          outputParameters:
            - type: object
              mapping: "$."
