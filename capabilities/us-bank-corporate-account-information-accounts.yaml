naftiko: 1.0.0-alpha2
info:
  label: US Bank Corporate Account Information API — Accounts
  description: 'US Bank Corporate Account Information API — Accounts. 1 operations. Lead operation: List Accounts. Self-contained
    Naftiko capability covering one Us Bancorp business surface.'
  tags:
  - Us Bancorp
  - Accounts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    US_BANCORP_API_KEY: US_BANCORP_API_KEY
capability:
  consumes:
  - type: http
    namespace: us-bank-corporate-account-information-accounts
    baseUri: https://api.usbank.com/v1
    description: US Bank Corporate Account Information API — Accounts business capability. Self-contained, no shared references.
    resources:
    - name: accounts
      path: /accounts
      operations:
      - name: listaccounts
        method: GET
        description: List Accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Correlation-ID
          in: header
          type: string
          description: Unique identifier for request/response correlation
          required: true
        - name: Accept
          in: header
          type: string
          description: Response media type
          required: true
        - name: On-Behalf-Of
          in: header
          type: string
          description: The U.S. Bank customer ID if submitted by a service provider on behalf of the customer
    authentication:
      type: bearer
      token: '{{env.US_BANCORP_API_KEY}}'
  exposes:
  - type: rest
    namespace: us-bank-corporate-account-information-accounts-rest
    port: 8080
    description: REST adapter for US Bank Corporate Account Information API — Accounts. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/accounts
      name: accounts
      description: REST surface for accounts.
      operations:
      - method: GET
        name: listaccounts
        description: List Accounts
        call: us-bank-corporate-account-information-accounts.listaccounts
        with:
          Correlation-ID: rest.Correlation-ID
          Accept: rest.Accept
          On-Behalf-Of: rest.On-Behalf-Of
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: us-bank-corporate-account-information-accounts-mcp
    port: 9090
    transport: http
    description: MCP adapter for US Bank Corporate Account Information API — Accounts. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-accounts
      description: List Accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: us-bank-corporate-account-information-accounts.listaccounts
      with:
        Correlation-ID: tools.Correlation-ID
        Accept: tools.Accept
        On-Behalf-Of: tools.On-Behalf-Of
      outputParameters:
      - type: object
        mapping: $.
